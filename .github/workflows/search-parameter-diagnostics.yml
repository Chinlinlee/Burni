# Diagnostics gate only — full profile (`npm run test:full`) stays a manual/release
# entry until Specimen CRUD is stable across full runs (see baseline.md).
name: SearchParameter Diagnostics

on:
  push:
    branches: [main, next, dev]
  pull_request:
    branches: [main, next, dev]

jobs:
  diagnostics-gate:
    name: Registry integrity CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostics verification script
        run: npm run search-parameter:verify

      - name: Run diagnostics CI gate tests
        run: npm run test:diagnostics-gate
